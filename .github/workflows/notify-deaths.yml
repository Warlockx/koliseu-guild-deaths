name: notify-deaths

# Near-real-time polling via a self-dispatching chain:
#   - Each run polls the guildDeaths.board API several times, 40s apart
#     (pollsPerRun / pollIntervalSeconds in config.json), commits state, then
#     re-triggers the next run via workflow_dispatch (allowed with GITHUB_TOKEN).
#   - The every-minute cron is only a WATCHDOG: GitHub's scheduler coalesces
#     frequent crons (in practice ~every 10 min), so the cron alone can't
#     deliver fast polling — the chain does. If the chain ever dies (failed
#     dispatch, hung runner), the cron re-anchors it within ~10 min.
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

# Never overlap two polling runs: a newer run cancels the older one. State is
# committed after every poll, so a cancelled run loses nothing (worst case a
# 1-2s window between a webhook send and its state push could re-send once).
concurrency:
  group: notify-deaths
  cancel-in-progress: true

permissions:
  contents: write # push state.json back
  actions: write  # workflow_dispatch the next cycle

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Poll guild deaths
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          POLLS="$(jq -r '.pollsPerRun' config.json)"
          INTERVAL="$(jq -r '.pollIntervalSeconds' config.json)"
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "guild-deaths-bot"
          git config user.email "actions@users.noreply.github.com"

          i=1
          while true; do
            echo "--- poll $i of $POLLS ---"
            node notify-deaths.mjs

            if [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -m "chore: update state [skip ci]"
              git push origin "$BRANCH"
            fi

            if [ "$i" -ge "$POLLS" ]; then break; fi
            sleep "$INTERVAL"
            # pick up any state pushed elsewhere before polling again
            if ! git pull --rebase --autostash origin "$BRANCH"; then
              git rebase --abort 2>/dev/null || true
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi
            i=$((i + 1))
          done

      # Keep the chain alive: immediately schedule the next polling cycle.
      # This is the documented GITHUB_TOKEN exception (workflow_dispatch).
      - name: Dispatch next cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notify-deaths.yml --repo "$GITHUB_REPOSITORY"
